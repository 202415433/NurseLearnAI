# =============================================================================
# NurseLearn AI — configuration de clamd (2.2.3-e, E1 : notification FreshClam → clamd)
#
# Monté en LECTURE SEULE à /etc/clamav/clamd.conf dans `clamd` ET dans `freshclam`.
# Reprend exactement la configuration de l'image officielle clamav/clamav:1.5.5
# (clamd.conf.sample + modifications de son Dockerfile : journal, horodatage, TCP 3310, utilisateur
# clamav) ; SEULE différence : le socket local est déplacé de /tmp (propre à chaque conteneur) vers
# /run/clamav, volume nommé `clamav-sock` dédié au socket et partagé avec freshclam. FreshClam lit
# ce même fichier (NotifyClamd /etc/clamav/clamd.conf) et peut donc demander le rechargement.
#
# Aucun /tmp partagé, aucun port publié, socket 0660 (propriétaire et groupe clamav seulement).
# =============================================================================
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
User clamav
