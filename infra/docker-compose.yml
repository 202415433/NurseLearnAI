# NurseLearn AI — services d'infrastructure pour le développement local
# (PostgreSQL+pgvector, Redis, stockage S3 RustFS, Mailpit) et application (API FastAPI, Web Next.js).
# Démarrage complet depuis la racine du dépôt :  docker compose up --build -d
# (équivalent :  docker compose -f infra/docker-compose.yml --env-file .env up --build -d)
name: nurselearn

services:
  postgres:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 + extension pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurselearn}
      POSTGRES_USER: ${POSTGRES_USER:-nurselearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"   # exposé uniquement en local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nurselearn} -d ${POSTGRES_DB:-nurselearn}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD doit être défini}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  s3:                                       # stockage compatible S3 (médias) — RustFS, Apache 2.0
    # MinIO a retiré ses images de Docker Hub (« pull access denied », constaté en Phase 1.1).
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-nurselearn}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY doit être défini}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # console : http://localhost:9001/rustfs/console/
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:                                  # capture des e-mails en développement (vérification de compte)
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  s3-init:                                  # R3 : identités et compartiments S3, puis arrêt
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    # Seul conteneur applicatif détenteur de la clé d'ADMINISTRATION RustFS (racine) : crée les
    # compartiments privés, les politiques IAM et les trois identités, puis s'arrête.
    command: ["python", "-m", "app.ops.s3_provision"]
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_ADMIN_ACCESS_KEY: ${S3_ACCESS_KEY:-nurselearn}
      S3_ADMIN_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY doit être défini}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?S3_API_SECRET_KEY doit être défini dans .env (R3)}
      S3_SCANNER_SECRET_KEY: ${S3_SCANNER_SECRET_KEY:?S3_SCANNER_SECRET_KEY doit être défini dans .env (R3)}
      S3_READER_SECRET_KEY: ${S3_READER_SECRET_KEY:?S3_READER_SECRET_KEY doit être défini dans .env (R3)}
      MEDIA_QUARANTINE_BUCKET: ${MEDIA_QUARANTINE_BUCKET:-nl-media-quarantine}
      MEDIA_CLEAN_BUCKET: ${MEDIA_CLEAN_BUCKET:-nl-media-clean}
    security_opt: ["no-new-privileges:true"]

  migrate:                                  # D14 : migrations et données de référence, puis arrêt
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # Seul conteneur détenteur de la connexion d'ADMINISTRATION (propriétaire via nl_owner) ;
    # il pose aussi les mots de passe des connexions applicatives nl_api et nl_media_scanner.
    command: ["sh", "-c", "n=0; until alembic upgrade head; do n=$$((n+1)); if [ $$n -ge 10 ]; then echo 'migrations impossibles : base injoignable' >&2; exit 1; fi; sleep 3; done && python -m app.seed"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nurselearn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nurselearn}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD doit être défini dans .env (D14)}
      MEDIA_SCANNER_DB_PASSWORD: ${MEDIA_SCANNER_DB_PASSWORD:-}
      LOG_LEVEL: INFO
    security_opt: ["no-new-privileges:true"]

  api:                                      # API FastAPI (Phases 1.2 à 2.1)
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    # D14 : l'API ne migre plus ; elle se connecte en nl_api (ni superutilisateur, ni propriétaire).
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Connexion APPLICATIVE nl_api (D14) : aucun identifiant d'administration dans ce conteneur.
      DATABASE_URL: postgresql+asyncpg://nl_api:${API_DB_PASSWORD:?API_DB_PASSWORD doit être défini dans .env (D14)}@postgres:5432/${POSTGRES_DB:-nurselearn}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Origines autorisées à appeler l'API depuis un navigateur (GET uniquement).
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      LOG_LEVEL: INFO
      # Limite par visiteur : le serveur Web transmet l'adresse du visiteur (X-Forwarded-For) et seul
      # le conteneur « web » est approuvé comme mandataire. En production : l'adresse du reverse proxy.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      TRUSTED_PROXIES: '${TRUSTED_PROXIES:-["web"]}'
      # Identité (Phase 2.1) : courriels capturés par Mailpit (aucun envoi réel), liens vers l'interface.
      MAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Clé HMAC des jetons : obligatoire en production ; vide en local = dérivée de DATABASE_URL.
      TOKEN_HASH_KEY: ${TOKEN_HASH_KEY:-}
      # Région déclarée (ADR-0008) : information de configuration, aucune garantie de résidence.
      DATA_REGION: ${DATA_REGION:-local-dev}
      # Durées de session et de jetons (documentées dans .env.example, ADR-0007).
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-120}
      SESSION_ABSOLUTE_LIFETIME_HOURS: ${SESSION_ABSOLUTE_LIFETIME_HOURS:-168}
      SENSITIVE_IDLE_TIMEOUT_MINUTES: ${SENSITIVE_IDLE_TIMEOUT_MINUTES:-30}
      SESSION_ROTATION_MINUTES: ${SESSION_ROTATION_MINUTES:-15}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-72}
      # Limites anti-automatisation (valeurs de développement plus larges : tests e2e répétés).
      REGISTER_PER_HOUR_PER_IP: ${REGISTER_PER_HOUR_PER_IP:-50}
      LOGIN_PER_10MIN_PER_IP: ${LOGIN_PER_10MIN_PER_IP:-100}
      EMAIL_ACTIONS_PER_HOUR_PER_IP: ${EMAIL_ACTIONS_PER_HOUR_PER_IP:-50}
      # Médias protégés (2.2.3-b) : stockage S3 PRIVÉ RustFS, joint uniquement par le réseau interne.
      # Aucune URL publique ni présignée ; le navigateur n'accède jamais au stockage.
      S3_ENDPOINT: http://s3:9000
      # R3 : identité S3 de TÉLÉVERSEMENT (écriture en quarantaine seulement), jamais la clé racine.
      S3_ACCESS_KEY: nl-api-uploader
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?S3_API_SECRET_KEY doit être défini dans .env (R3)}
      MEDIA_QUARANTINE_BUCKET: ${MEDIA_QUARANTINE_BUCKET:-nl-media-quarantine}
      MEDIA_CLEAN_BUCKET: ${MEDIA_CLEAN_BUCKET:-nl-media-clean}
    ports:
      - "127.0.0.1:${API_PORT:-28000}:8000"

  media-delivery:                           # 2.2.3-d : diffusion des médias sains (processus séparé)
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    # Service DISTINCT de l'API : il détient la seule identité S3 de LECTURE (nl-media-reader,
    # compartiment sain uniquement) et aucune route d'écriture. Chaque requête, y compris chaque
    # requête Range, est authentifiée par la session (Bearer) et autorisée à neuf ; aucune URL de
    # stockage, aucun jeton autonome. Le navigateur passe par le serveur Web (2.2.3-e), jamais par S3.
    command: ["uvicorn", "app.main:create_delivery_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Même connexion applicative que l'API (nl_api, D14) : la valeur doit être IDENTIQUE (clé des
      # sessions dérivée de DATABASE_URL en local ; TOKEN_HASH_KEY partagé en production).
      DATABASE_URL: postgresql+asyncpg://nl_api:${API_DB_PASSWORD:?API_DB_PASSWORD doit être défini dans .env (D14)}@postgres:5432/${POSTGRES_DB:-nurselearn}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: '[]'                    # aucun appel direct depuis un navigateur
      LOG_LEVEL: INFO
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      TRUSTED_PROXIES: '${TRUSTED_PROXIES:-["web"]}'
      TOKEN_HASH_KEY: ${TOKEN_HASH_KEY:-}
      DATA_REGION: ${DATA_REGION:-local-dev}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-120}
      SESSION_ABSOLUTE_LIFETIME_HOURS: ${SESSION_ABSOLUTE_LIFETIME_HOURS:-168}
      SENSITIVE_IDLE_TIMEOUT_MINUTES: ${SENSITIVE_IDLE_TIMEOUT_MINUTES:-30}
      SESSION_ROTATION_MINUTES: ${SESSION_ROTATION_MINUTES:-15}
      S3_ENDPOINT: http://s3:9000
      # R3 / 2.2.3-d : identité S3 de LECTURE seule ; ni téléversement, ni analyse, ni clé racine.
      S3_ACCESS_KEY: nl-media-reader
      S3_SECRET_KEY: ${S3_READER_SECRET_KEY:?S3_READER_SECRET_KEY doit être défini dans .env (R3)}
      MEDIA_CLEAN_BUCKET: ${MEDIA_CLEAN_BUCKET:-nl-media-clean}
      # Limites de diffusion (valeurs par défaut documentées dans .env.example).
      MEDIA_DELIVERY_CONTENT_PER_MINUTE_USER: ${MEDIA_DELIVERY_CONTENT_PER_MINUTE_USER:-240}
      MEDIA_DELIVERY_PREVIEW_PER_MINUTE_USER: ${MEDIA_DELIVERY_PREVIEW_PER_MINUTE_USER:-120}
      MEDIA_DELIVERY_PER_MINUTE_ORG: ${MEDIA_DELIVERY_PER_MINUTE_ORG:-3000}
      MEDIA_DELIVERY_RANGE_PER_MINUTE_MEDIA: ${MEDIA_DELIVERY_RANGE_PER_MINUTE_MEDIA:-120}
      MEDIA_DELIVERY_BYTES_PER_MINUTE_USER: ${MEDIA_DELIVERY_BYTES_PER_MINUTE_USER:-536870912}
      MEDIA_DELIVERY_CONCURRENT_STREAMS_USER: ${MEDIA_DELIVERY_CONCURRENT_STREAMS_USER:-4}
      MEDIA_DELIVERY_RECHECK_SECONDS: ${MEDIA_DELIVERY_RECHECK_SECONDS:-10}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "127.0.0.1:${MEDIA_DELIVERY_PORT:-28001}:8000"

  # ---------------------------------------------------------------------------------------------
  # Analyse antivirus des médias (2.2.3-c, ADR-0011) — profil « media » :
  #   docker compose --profile media up -d
  # clamd et freshclam : image officielle Cisco-Talos (GPL-2.0, gratuite), version épinglée,
  # signatures préchargées puis tenues à jour. Aucun port publié ; aucun accès au stockage S3.
  # ---------------------------------------------------------------------------------------------
  freshclam:                                # mises à jour des signatures (seul service ClamAV sur Internet)
    image: clamav/clamav:1.5.5
    profiles: ["media"]
    restart: unless-stopped
    environment:
      CLAMAV_NO_CLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "12"               # 12 vérifications par jour
    volumes:
      - clamav-db:/var/lib/clamav          # signatures (volume dédié, jamais supprimé)
      - clamav-sock:/run/clamav            # socket de clamd (volume dédié) : notification de rechargement
      # 2.2.3-e : même clamd.conf que clamd (socket /run/clamav/clamd.sock) → NotifyClamd fonctionne.
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [clamav-updates]
    mem_limit: 1g
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/clamav/daily.cvd -o -s /var/lib/clamav/daily.cld"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s

  clamd:                                    # moteur d'analyse, joignable seulement par le worker
    image: clamav/clamav:1.5.5
    profiles: ["media"]
    restart: unless-stopped
    depends_on:
      freshclam:
        condition: service_healthy
    # 2.2.3-e : le volume du socket est créé par Docker au nom de root ; clamd abandonne ses droits
    # (utilisateur clamav) AVANT de créer son socket. Le répertoire lui est donc attribué (0750) au
    # démarrage, puis l'entrée standard de l'image (/init) prend le relais, inchangée.
    entrypoint: ["/bin/sh", "-c", "chown clamav:clamav /run/clamav && chmod 0750 /run/clamav && exec /init"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav-db:/var/lib/clamav
      - clamav-sock:/run/clamav            # socket /run/clamav/clamd.sock (0660, clamav)
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks: [media-scan]                  # réseau interne : ni Internet, ni base, ni stockage
    # Pic de mémoire au rechargement des signatures (deux jeux en mémoire) : ≈ 2 × 1,1 Go.
    mem_limit: 3g
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  media-worker:                             # worker d'analyse : quarantaine → clamd → verdict → copie saine
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    profiles: ["media"]
    command: ["python", "-m", "app.workers.media_scan"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully   # migrations, données de référence, connexion de service
      s3-init:
        condition: service_completed_successfully   # identités et compartiments S3
      api:
        condition: service_healthy
      clamd:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Connexion de SERVICE (rôle nl_media_scanner, privilèges minimaux), jamais celle de l'API.
      DATABASE_URL: postgresql://nl_media_scanner:${MEDIA_SCANNER_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-nurselearn}
      MEDIA_SCANNER_DATABASE_URL: postgresql://nl_media_scanner:${MEDIA_SCANNER_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-nurselearn}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAMD_HOST: clamd
      CLAMD_PORT: 3310
      S3_ENDPOINT: http://s3:9000
      # R3 : identité S3 d'ANALYSE (lecture de la quarantaine, écriture du compartiment sain).
      S3_ACCESS_KEY: nl-media-scanner
      S3_SECRET_KEY: ${S3_SCANNER_SECRET_KEY:?S3_SCANNER_SECRET_KEY doit être défini dans .env (R3)}
      MEDIA_QUARANTINE_BUCKET: ${MEDIA_QUARANTINE_BUCKET:-nl-media-quarantine}
      MEDIA_CLEAN_BUCKET: ${MEDIA_CLEAN_BUCKET:-nl-media-clean}
      MEDIA_TMP_DIR: /tmp
      LOG_LEVEL: INFO
    networks: [default, media-scan]
    read_only: true
    tmpfs:
      - /tmp:size=450m,mode=1777            # copie temporaire d'un média (200 Mio au plus), effacée après analyse
    mem_limit: 1g
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/nl-media-worker.alive'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s

  web:                                      # Interface Next.js (Phases 1.2 à 2.1)
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      media-delivery:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000      # réseau interne Docker : le navigateur ne voit jamais l'API
      # 2.2.3-e : destination FIXE du relais des médias (/relais/medias/…). Le navigateur ne voit ni ce
      # service ni le stockage ; la session (cookie HttpOnly) part en Authorization à chaque requête.
      MEDIA_DELIVERY_INTERNAL_URL: http://media-delivery:8000
      # Cookie de session « Secure » : true en production (HTTPS) ; false en local (http://web:3000 en e2e).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/fr').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

networks:
  default: {}
  media-scan:
    internal: true                          # clamd ↔ worker seulement, sans sortie Internet
  clamav-updates: {}                        # freshclam ↔ miroirs de signatures seulement

volumes:
  pgdata:
  redisdata:
  s3data:
  clamav-db:                                # signatures ClamAV (persistant)
  clamav-sock:
