name: CI

on:
  push:
    branches: [main, "phase-*", "lot-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGPASSWORD: ci

jobs:
  database:
    name: Schéma PostgreSQL + règles métier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NL_TEST_PGHOST: localhost
      NL_TEST_PGPORT: "5432"
      NL_TEST_PGUSER: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "pytest>=8,<10"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Tests du schéma et des règles métier (avec pgvector)
        run: python -m pytest -q -rs database/tests
      - name: Chaîne de révisions (substitut, pgvector inclus)
        run: python -m pytest -q -rs services/api/tests/test_migrations.py

  alembic:
    name: Alembic réel (upgrade / downgrade / upgrade)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/nl_alembic
      PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "alembic>=1.13,<2" "sqlalchemy>=2.0,<3" "psycopg[binary]>=3.2,<4"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: $PSQL -c "CREATE DATABASE nl_alembic"
      - name: upgrade head
        working-directory: services/api
        run: alembic upgrade head && alembic current
      - run: $PSQL -d nl_alembic -f database/checks/verify_head.sql
      - name: upgrade head (idempotence — aucune révision rejouée)
        working-directory: services/api
        run: alembic upgrade head
      - name: Données de référence appliquées deux fois (idempotence)
        run: |
          $PSQL -d nl_alembic -f database/seeds/0001_reference_data.sql
          $PSQL -d nl_alembic -f database/seeds/0001_reference_data.sql
          test "$($PSQL -d nl_alembic -Atc 'SELECT count(*) FROM professions')" = "12"
      - name: downgrade base
        working-directory: services/api
        run: alembic downgrade base
      - run: $PSQL -d nl_alembic -f database/checks/verify_base.sql
      - name: upgrade head (réapplication)
        working-directory: services/api
        run: alembic upgrade head
      - run: $PSQL -d nl_alembic -f database/checks/verify_head.sql

  api:
    name: API FastAPI (tests sur PostgreSQL + Redis réels)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
      # Stockage S3 réel des médias (2.2.3-b) : même image que Docker Compose.
      s3:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: ci-media-access
          RUSTFS_SECRET_KEY: ci-media-secret-key
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports: ["9000:9000"]
        volumes:
          # Volume nommé (comme Compose) : il hérite des droits de /data dans l'image (RustFS n'est pas root).
          - rustfs-ci-data:/data
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health/ready || exit 1" --health-interval 5s --health-timeout 5s --health-retries 30
      # ClamAV RÉEL (2.2.3-c) : même image que Docker Compose, signatures préchargées puis mises à jour
      # par freshclam au démarrage. Les tests attendent des signatures de moins de 48 h.
      clamav:
        image: clamav/clamav:1.5.5
        ports: ["3310:3310"]
        options: >-
          --health-cmd "clamdcheck.sh" --health-interval 10s --health-timeout 10s --health-retries 60 --health-start-period 30s
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/nl_api
      REDIS_URL: redis://localhost:6379/0
      # Tests de téléversement sur RustFS réel (sans ces variables, ils seraient ignorés).
      NL_TEST_S3_ENDPOINT: http://localhost:9000
      NL_TEST_S3_KIND: rustfs
      S3_ACCESS_KEY: ci-media-access
      S3_SECRET_KEY: ci-media-secret-key
      # Worker d'analyse sur ClamAV réel (EICAR, pannes, reprise).
      NL_TEST_CLAMD_HOST: localhost
      NL_TEST_CLAMD_PORT: "3310"
      # Courriels locaux (Mailpit) : test d'envoi réel sans service payant.
      MAILPIT_URL: http://localhost:8025
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Qualité Python (Ruff lint + format, mypy)
        run: |
          ruff check ../..
          ruff format --check ../..
          mypy
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -h localhost -U postgres -c "CREATE DATABASE nl_api"
      - name: Migrations et données de référence (connexion d'administration)
        env:
          API_DB_PASSWORD: ci-api-connection-pw
        run: alembic upgrade head && python -m app.seed && python -m app.seed
      - name: ClamAV — charger les signatures téléchargées par freshclam
        # L'image de service démarre clamd sur la base qu'elle embarque pendant que freshclam télécharge la
        # mise à jour ; la notification freshclam → clamd est inopérante (/tmp/clamd.sock, connu depuis
        # 2.2.3-c). On demande donc à clamd de recharger (commande RELOAD, ce que ferait la notification)
        # jusqu'à obtenir des signatures de moins de 47 h. Aucun seuil abaissé, aucun contournement.
        run: |
          python - <<'EOF'
          import socket, sys, time
          from app.workers.clamd import ClamdClient
          client, deadline = ClamdClient("localhost", 3310, 30), time.time() + 600
          while time.time() < deadline:
              try:
                  info = client.version()
                  print(info, flush=True)
                  if info.signatures_published_at and time.time() - info.signatures_published_at.timestamp() < 47 * 3600:
                      sys.exit(0)
                  with socket.create_connection(("localhost", 3310), timeout=10) as sock:
                      sock.sendall(b"zRELOAD\0")
                      print("RELOAD :", sock.recv(64), flush=True)
              except Exception as exc:  # démon en (re)chargement : on réessaie
                  print(type(exc).__name__, exc, flush=True)
              time.sleep(15)
          sys.exit("ClamAV : signatures toujours absentes ou périmées après rechargement")
          EOF
      - name: Tests de l'API — application connectée en nl_api (D14), fixtures en administration
        # Avertissement httpx de Starlette traité comme une erreur : il ne doit pas réapparaître.
        env:
          DATABASE_URL: postgresql+asyncpg://nl_api:ci-api-connection-pw@localhost:5432/nl_api
          NL_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/nl_api
        run: python -m pytest -q -rs -W "error:Using .httpx. with .starlette.testclient.:DeprecationWarning" tests/api tests/unit
      - name: L'API démarre avec uvicorn (connexion nl_api) et répond
        env:
          DATABASE_URL: postgresql+asyncpg://nl_api:ci-api-connection-pw@localhost:5432/nl_api
        run: |
          uvicorn app.main:create_app --factory --port 8000 --no-server-header &
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break; sleep 1; done
          curl -fsS "localhost:8000/api/v1/professions?jurisdiction=CA-QC" | grep -q '"code":"pab"'
          curl -fsS "localhost:8000/api/v1/programs?jurisdiction=CA-QC&profession=pab" | grep -q '"total":0'
          # 2.2.3-d : service de diffusion séparé (lecture seule) ; aucune diffusion sans session.
          uvicorn app.main:create_delivery_app --factory --port 8001 --no-server-header &
          for i in $(seq 1 30); do curl -fsS localhost:8001/ready && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/api/v1/media/00000000-0000-4000-a000-000000000000/preview)" = "401"

  web:
    name: Web Next.js (composants, build, parcours e2e, accessibilité axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/nl_web
      API_INTERNAL_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # Parcours d'identité e2e : courriels via Mailpit, cookie non « Secure » (HTTP local).
      MAIL_BACKEND: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAILPIT_URL: http://localhost:8025
      PUBLIC_WEB_URL: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: API de test (migrations, données, démarrage)
        working-directory: services/api
        run: |
          pip install -e .
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -c "CREATE DATABASE nl_web"
          alembic upgrade head && python -m app.seed
          # Programme publié FICTIF et non médical, pour tester l'écran de détail (CI uniquement).
          PGOPTIONS="-c nl.allow_demo=on" psql -h localhost -U postgres -d nl_web -v ON_ERROR_STOP=1 -f ../../database/fixtures/e2e_demo_published.sql
          nohup uvicorn app.main:create_app --factory --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break; sleep 1; done
        env:
          PGPASSWORD: ci
      - name: Installation et build
        working-directory: apps/web
        run: npm ci && npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
      - name: Navigateur Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Parcours e2e + axe
        working-directory: apps/web
        run: npm run test:e2e
        env:
          E2E_DEMO: "1"
      - name: Journal de l'API en cas d'échec
        if: failure()
        run: cat /tmp/api.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  dependency-audit:
    name: Audit des dépendances (npm, pip) — aucune vulnérabilité élevée ou critique
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: npm audit (production et développement)
        working-directory: apps/web
        run: npm audit --package-lock-only --audit-level=high
      - name: pip-audit (dépendances de l'API)
        working-directory: services/api
        # Environnement réel de l'API (dépendances + outils de développement) audité tel qu'installé.
        run: |
          pip install -e ".[dev]" pip-audit
          pip freeze --exclude-editable > /tmp/req.txt
          pip-audit --strict --disable-pip --no-deps -r /tmp/req.txt

  design-tokens:
    name: Design system (contrastes WCAG)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm test
        working-directory: packages/design-tokens
      - name: Les fichiers générés sont à jour
        run: git diff --exit-code packages/design-tokens/dist

  media-e2e:
    name: Parcours médias (pile réelle, ClamAV réel, Playwright + axe)
    # 2.2.3-e : les 24 parcours de apps/web/e2e/medias.spec.ts sur la pile Docker complète (PostgreSQL,
    # Redis, RustFS, ClamAV + freshclam, media-worker, media-delivery, relais Next.js). Données
    # SYNTHÉTIQUES (scripts/e2e_media_setup.py) ; EICAR construit en mémoire ; aucun simulacre de ClamAV.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Configuration (secrets aléatoires propres à l'exécution)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^API_DB_PASSWORD=.*/API_DB_PASSWORD=$(openssl rand -hex 24)/" .env
          for v in S3_SECRET_KEY S3_API_SECRET_KEY S3_SCANNER_SECRET_KEY S3_READER_SECRET_KEY; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 16)/" .env
          done
          echo "MEDIA_SCANNER_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          docker compose --profile media config -q
      - name: Pile complète avec le profil media (attente de la santé)
        run: |
          wait_stack() {
            for i in $(seq 1 "$1"); do
              bad=$(docker compose --profile media ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' | awk -F'|' '$1=="migrate" || $1=="s3-init" { if ($2!="exited" || $4!="0") print; next } $2!="running" || ($3!="" && $3!="healthy")')
              [ -z "$bad" ] && return 0
              sleep 5
            done
            echo "Services non prêts : $bad"; docker compose --profile media logs --tail 40 migrate s3-init clamd; return 1
          }
          docker compose --profile media up -d --build
          wait_stack 180
      - name: ClamAV réel — signatures fraîches (≤ 48 h, contrôle fermé du worker)
        run: |
          # freshclam télécharge les signatures et notifie clamd par le socket dédié (2.2.3-e) ; à défaut
          # d'une mise à jour, RELOAD par le même chemin. Le contrôle de fraîcheur du worker est inchangé.
          for i in $(seq 1 40); do
            # --self-check est un diagnostic (code 0 en toute circonstance) : la fraîcheur se lit dans son JSON.
            docker compose exec -T media-worker python -m app.workers.media_scan --self-check > "$RUNNER_TEMP/clamav.json" || true
            cat "$RUNNER_TEMP/clamav.json"
            python3 -c "import json,sys; sys.exit(0 if json.loads(open(sys.argv[1]).read().strip().splitlines()[-1]).get('signatures_fresh') is True else 1)" "$RUNNER_TEMP/clamav.json" && exit 0
            docker compose exec -T -u clamav freshclam clamdscan --config-file=/etc/clamav/clamd.conf --reload || true
            sleep 15
          done
          echo "ClamAV : signatures absentes ou périmées"; exit 1
      - name: Données synthétiques (comptes @example.test, établissements fictifs, EICAR en mémoire)
        run: |
          get() { grep -E "^$1=" .env | head -1 | cut -d= -f2-; }
          mkdir -p "$RUNNER_TEMP/e2e-media" && chmod 777 "$RUNNER_TEMP/e2e-media"
          docker run --rm --network nurselearn_default -v "$PWD:/repo" -v "$RUNNER_TEMP/e2e-media:/fixtures" -w /repo \
            -e API_URL=http://api:8000 -e "ADMIN_DSN=postgresql://$(get POSTGRES_USER):$(get POSTGRES_PASSWORD)@postgres:5432/$(get POSTGRES_DB)" \
            -e "REDIS_URL=redis://:$(get REDIS_PASSWORD)@redis:6379/0" -e S3_ENDPOINT=http://s3:9000 \
            -e S3_UPLOADER_KEY=nl-api-uploader -e "S3_UPLOADER_SECRET=$(get S3_API_SECRET_KEY)" \
            -e QUARANTINE_BUCKET=nl-media-quarantine -e FIXTURES_DIR=/fixtures -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim sh -c "pip install -q --disable-pip-version-check --root-user-action=ignore -e services/api imageio-ffmpeg && python scripts/e2e_media_setup.py > /fixtures/setup.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert len(d['accounts'])==7 and d['infectedMedia']; print('comptes', len(d['accounts']))" "$RUNNER_TEMP/e2e-media/setup.json"
          ls "$RUNNER_TEMP/e2e-media" | grep -v setup.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dépendances Web et Google Chrome (décodage H.264)
        working-directory: apps/web
        run: |
          npm ci
          google-chrome --version || npx playwright install --with-deps chrome
      - name: 24 parcours médias + axe (WCAG 2.2 AA)
        working-directory: apps/web
        run: npx playwright test --project=chrome-media --reporter=list,json
        env:
          CI: "1"
          E2E_BASE_URL: http://localhost:3000
          E2E_MEDIA_FILE: ${{ runner.temp }}/e2e-media/setup.json
          E2E_MEDIA_FILES: ${{ runner.temp }}/e2e-media
          E2E_CAPTURES: ${{ runner.temp }}/media-artifacts/captures
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/media-artifacts/resultats-playwright.json
      - name: Bilan — 24 réussis, aucun échec, aucun saut, aucune instabilité
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/media-artifacts/resultats-playwright.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))["stats"]
          print(s)
          assert s["expected"] == 24 and s["unexpected"] == 0 and s["skipped"] == 0 and s["flaky"] == 0, s
          PY
      - name: Artefacts assainis (aucun mot de passe ni secret)
        if: always()
        run: |
          # Comptes synthétiques : leurs mots de passe ne quittent jamais le runner ; secrets de la pile exclus.
          python3 - "$RUNNER_TEMP/e2e-media/setup.json" "$RUNNER_TEMP/media-artifacts" <<'PY'
          import json, os, pathlib, sys
          secrets = []
          if os.path.exists(sys.argv[1]):
              secrets += [a["password"] for a in json.load(open(sys.argv[1]))["accounts"].values()]
          for line in open(".env"):
              k, _, v = line.strip().partition("=")
              if any(t in k for t in ("PASSWORD", "SECRET", "KEY")) and len(v) >= 12:
                  secrets.append(v)
          for p in pathlib.Path(sys.argv[2]).rglob("*"):
              if p.is_file():
                  data = p.read_bytes()
                  assert not any(s.encode() in data for s in secrets), f"secret dans {p}"
          print("artefacts sans secret")
          PY
          rm -f "$RUNNER_TEMP/e2e-media/setup.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parcours-medias-captures-et-resultats
          path: ${{ runner.temp }}/media-artifacts
          retention-days: 14
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose --profile media logs --tail 120 api web media-delivery media-worker clamd freshclam

  compose:
    name: Docker Compose (pile complète, santé, communication entre services)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Scripts PowerShell encodés en UTF-8 avec BOM (sinon Windows PowerShell 5.1 les lit en ANSI)
        run: |
          for f in scripts/*.ps1; do
            head -c3 "$f" | od -An -tx1 | grep -q "ef bb bf" || { echo "BOM manquant : $f"; exit 1; }
          done
      - name: Configuration (racine et infra)
        run: |
          cp .env.example .env
          # D14 : connexion applicative de l'API (secret aléatoire propre à l'exécution).
          sed -i "s/^API_DB_PASSWORD=.*/API_DB_PASSWORD=$(openssl rand -hex 24)/" .env
          # R3 : une identité S3 par service (secrets aléatoires propres à l'exécution).
          for v in S3_API_SECRET_KEY S3_SCANNER_SECRET_KEY S3_READER_SECRET_KEY; do
            sed -i "s/^$v=.*/$v=$(openssl rand -hex 16)/" .env
          done
          docker compose config -q
          docker compose config --services | sort | tr '\n' ' ' | tee /tmp/services
          grep -q "api mailpit media-delivery migrate postgres redis s3 s3-init web" /tmp/services
          # L'API ne reçoit AUCUN identifiant d'administration ; seule `migrate` les détient.
          docker compose config --format json | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; e=s['api']['environment']; assert '//nl_api:' in e['DATABASE_URL'] and not any(k in e for k in ('POSTGRES_PASSWORD','MEDIA_SCANNER_DB_PASSWORD','API_DB_PASSWORD')), 'API : identifiants'; print('api: nl_api uniquement')"
          # R3 : ni l'API ni le worker ne reçoivent la clé racine RustFS ; seul `s3-init` la détient.
          docker compose --profile media config --format json | python3 -c "
          import json,sys
          s=json.load(sys.stdin)['services']; root=s['s3']['environment']['RUSTFS_SECRET_KEY']
          a=s['api']['environment']; w=s['media-worker']['environment']; i=s['s3-init']['environment']
          assert a['S3_ACCESS_KEY']=='nl-api-uploader' and w['S3_ACCESS_KEY']=='nl-media-scanner', 'identités'
          assert root not in (a['S3_SECRET_KEY'], w['S3_SECRET_KEY']) and a['S3_SECRET_KEY']!=w['S3_SECRET_KEY'], 'réutilisation'
          assert not any('READER' in k or 'ADMIN' in k for k in list(a)+list(w)), 'secret de lecture ou admin exposé'
          assert i['S3_ADMIN_SECRET_KEY']==root
          for n,svc in s.items():
              if n not in ('s3','s3-init'): assert root not in json.dumps(svc.get('environment',{})), n
          d=s['media-delivery']['environment']  # 2.2.3-d : diffusion = identité de LECTURE seule
          assert d['S3_ACCESS_KEY']=='nl-media-reader' and d['S3_SECRET_KEY']==i['S3_READER_SECRET_KEY']
          assert d['S3_SECRET_KEY'] not in (a['S3_SECRET_KEY'], w['S3_SECRET_KEY']) and 'MEDIA_QUARANTINE_BUCKET' not in d
          assert d['DATABASE_URL']==a['DATABASE_URL'] and '//nl_api:' in d['DATABASE_URL']
          print('R3 : clé racine réservée à s3 et s3-init ; diffusion en lecture seule')"
          # Profil « media » (2.2.3-c) : ClamAV et worker, absents de la pile par défaut.
          docker compose --profile media config -q
          docker compose --profile media config --services | sort | tr '\n' ' ' | tee /tmp/media
          grep -q "clamd freshclam mailpit media-delivery media-worker" /tmp/media
          test -z "$(docker compose --profile media config | sed -n '/^  clamd:/,/^  [a-z-]*:$/p' | grep -E '^\s+ports:')"
      - name: docker compose up --build -d (attente de la santé)
        run: |
          # `up --wait` échoue quand le conteneur ponctuel `migrate` se termine (même avec le code 0) :
          # attente explicite — services en marche et sains, `migrate` terminé avec le code 0.
          wait_stack() {
            for i in $(seq 1 "$1"); do
              bad=$(docker compose $2 ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' | awk -F'|' '$1=="migrate" || $1=="s3-init" { if ($2!="exited" || $4!="0") print; next } $2!="running" || ($3!="" && $3!="healthy")')
              [ -z "$bad" ] && return 0
              sleep 5
            done
            echo "Services non prêts : $bad"; docker compose $2 logs --tail 40 migrate s3-init; return 1
          }
          docker compose up --build -d
          wait_stack 60 ""
      - name: API, Web et communication interne
        run: |
          curl -fsS localhost:28000/ready | grep -q '"database":"ok"'
          curl -fsS "localhost:28000/api/v1/professions?jurisdiction=CA-QC" | grep -q '"in_preparation":1'
          curl -fsS localhost:3000/fr/pays | grep -q "Sénégal"
          curl -fsS "localhost:3000/fr/metiers?j=CA-QC" | grep -q "non encore validé"
          docker compose exec -T web node -e "fetch('http://api:8000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          # D14 : migrations terminées par `migrate` ; l'API connectée en nl_api, sans droit d'administration.
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
          # R3 : identités S3 provisionnées et vérifiées ; l'API n'a que l'écriture en quarantaine.
          test "$(docker compose ps -a s3-init --format '{{.ExitCode}}')" = "0"
          docker compose run --rm --no-deps -T s3-init python -m app.ops.s3_provision --check
          # Sonde par l'entrée standard (le worker a un système de fichiers en lecture seule, /tmp en tmpfs).
          docker compose exec -T api python - api < scripts/r3_s3_probe.py
          # 2.2.3-d : service de diffusion séparé, identité de lecture seule, session obligatoire.
          curl -fsS localhost:28001/ready | grep -q '"database":"ok"'
          docker compose exec -T media-delivery python - reader < scripts/r3_s3_probe.py
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:28001/api/v1/media/00000000-0000-4000-a000-000000000000/preview)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer inconnu' 'localhost:28001/api/v1/media/00000000-0000-4000-a000-000000000000/content?release=00000000-0000-4000-a000-000000000000&lesson_version=00000000-0000-4000-a000-000000000000')" = "401"
          curl -fsS localhost:28000/openapi.json | python3 -c "import json,sys; p=json.load(sys.stdin)['paths']; assert not any(k.startswith('/api/v1/media') for k in p), 'API : aucune diffusion'"
          docker compose exec -T postgres psql -U nurselearn -d nurselearn -v ON_ERROR_STOP=1 -q -f /database/checks/verify_head.sql
          test "$(docker compose exec -T postgres psql -U nurselearn -d nurselearn -Atc "SELECT count(*) FROM pg_stat_activity WHERE usename = 'nl_api'")" -ge 1
          docker compose exec -T api python /dev/stdin <<'PY'
          import asyncio, os
          import asyncpg
          async def main():
              c = await asyncpg.connect(os.environ["DATABASE_URL"].replace("postgresql+asyncpg", "postgresql"))
              assert await c.fetchval("SELECT current_user") == "nl_api"
              try:
                  await c.execute("ALTER TABLE media_assets DISABLE TRIGGER USER")
              except asyncpg.InsufficientPrivilegeError:
                  print("API = nl_api ; désactivation de déclencheur refusée")
              else:
                  raise SystemExit("D14 : l'API a pu désactiver un déclencheur")
          asyncio.run(main())
          PY
          test -z "$(curl -fsS -H 'Origin: https://evil.example' -D - -o /dev/null localhost:28000/api/v1/countries | grep -i access-control-allow-origin)"
      - name: Profil media (2.2.3-c) — ClamAV, worker d'analyse, identité de service, mémoire réelle
        run: |
          echo "MEDIA_SCANNER_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          # `up --wait` échoue quand le conteneur ponctuel `migrate` se termine (même avec le code 0) :
          # attente explicite — services en marche et sains, `migrate` terminé avec le code 0.
          wait_stack() {
            for i in $(seq 1 "$1"); do
              bad=$(docker compose $2 ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' | awk -F'|' '$1=="migrate" || $1=="s3-init" { if ($2!="exited" || $4!="0") print; next } $2!="running" || ($3!="" && $3!="healthy")')
              [ -z "$bad" ] && return 0
              sleep 5
            done
            echo "Services non prêts : $bad"; docker compose $2 logs --tail 40 migrate s3-init; return 1
          }
          docker compose --profile media up -d --build
          wait_stack 180 "--profile media"
          docker compose exec -T media-worker python -c "from app.core.config import get_settings as g; from app.workers.media_scan import MediaScanWorker as W; w = W(g()); w.store.connect(); print('identite', w.store.conn.info.user); print(w.clamd.version())"
          # clamd n'est joignable ni depuis l'hôte, ni depuis l'API (réseau interne media-scan).
          ! (exec 3<>/dev/tcp/127.0.0.1/3310) 2>/dev/null
          ! docker compose exec -T api python -c "import socket; socket.create_connection(('clamd', 3310), timeout=3)" 2>/dev/null
          # R3 : le worker lit la quarantaine et écrit le compartiment sain, sans aucun droit d'administration.
          docker compose exec -T media-worker python - scanner < scripts/r3_s3_probe.py
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | grep -E 'clamd|freshclam|media-worker'
      - name: FreshClam → clamd (2.2.3-e) — socket dédié, notification, rechargement effectif, redémarrages
        run: |
          # Version chargée par clamd (via le worker, réseau interne) et version présente sur disque.
          loaded() { docker compose exec -T media-worker python -c "from app.core.config import get_settings as g; from app.workers.clamd import ClamdClient as C; s = g(); print(C(s.clamd_host, s.clamd_port, 10).version().signature_version)"; }
          ondisk() { docker compose exec -T freshclam sh -c 'for f in daily.cld daily.cvd; do [ -s /var/lib/clamav/$f ] && sigtool --info /var/lib/clamav/$f && break; done' | awk '/^Version:/ {print $2}'; }
          ping_from_freshclam() { docker compose exec -T -u clamav freshclam clamdscan --config-file=/etc/clamav/clamd.conf --ping 5; }
          # 1. Socket dédié (volume clamav-sock) : propriétaire clamav, 0660 ; plus aucun socket dans /tmp.
          test "$(docker compose exec -T clamd stat -c '%U:%G %a %F' /run/clamav/clamd.sock)" = "clamav:clamav 660 socket"
          test "$(docker compose exec -T clamd stat -c '%U %a' /run/clamav)" = "clamav 750"
          ! docker compose exec -T clamd test -S /tmp/clamd.sock
          # 2. Notification : freshclam (hors réseau media-scan : PAS de TCP) joint clamd par le socket, en clamav.
          docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$(docker compose ps -q freshclam)" | tee /tmp/fc-net
          ! grep -q media-scan /tmp/fc-net
          ping_from_freshclam
          # 3. Rechargement effectif : RELOAD par le chemin de NotifyClamd, puis version chargée = version sur disque.
          before=$(docker compose logs clamd 2>&1 | grep -c "Database correctly reloaded" || true)
          docker compose exec -T -u clamav freshclam clamdscan --config-file=/etc/clamav/clamd.conf --reload
          for i in $(seq 1 60); do
            after=$(docker compose logs clamd 2>&1 | grep -c "Database correctly reloaded" || true)
            [ "$after" -gt "$before" ] && [ "$(loaded)" = "$(ondisk)" ] && break; sleep 5
          done
          echo "rechargements : $before -> $after ; chargée=$(loaded) ; disque=$(ondisk)"
          test "$after" -gt "$before" && test "$(loaded)" = "$(ondisk)"
          if docker compose logs freshclam 2>&1 | grep -q "Clamd successfully notified"; then echo "notification freshclam : réussie"; fi
          # 4. Redémarrages : socket recréé (FixStaleSocket), notification toujours possible.
          docker compose restart clamd
          for i in $(seq 1 120); do [ "$(docker compose ps clamd --format '{{.Health}}')" = "healthy" ] && break; sleep 5; done
          ping_from_freshclam
          docker compose restart freshclam
          for i in $(seq 1 60); do [ "$(docker compose ps freshclam --format '{{.Health}}')" = "healthy" ] && break; sleep 5; done
          ping_from_freshclam
          # 5. FreshClam indisponible : clamd continue de servir ; la fraîcheur (≤ 48 h) reste exigée par le worker.
          docker compose stop freshclam
          docker compose exec -T media-worker python -m app.workers.media_scan --self-check
          test "$(docker compose ps clamd --format '{{.Health}}')" = "healthy"
          docker compose start freshclam
          ! docker compose logs freshclam 2>&1 | tail -50 | grep -q "Can't connect to clamd through /tmp/clamd.sock"
      - name: Persistance après redémarrage de PostgreSQL
        run: |
          docker compose restart postgres
          for i in $(seq 1 30); do curl -fsS localhost:28000/ready && break; sleep 2; done
          curl -fsS "localhost:28000/api/v1/jurisdictions?country=CA" | grep -q '"total":5'
      - name: Persistance des identités et politiques S3 après redémarrage de RustFS (R3)
        run: |
          docker compose restart s3
          for i in $(seq 1 30); do [ "$(docker compose ps s3 --format '{{.Health}}')" = "healthy" ] && break; sleep 2; done
          docker compose run --rm --no-deps -T s3-init python -m app.ops.s3_provision --check
          docker compose exec -T api python - api < scripts/r3_s3_probe.py
          docker compose exec -T media-worker python - scanner < scripts/r3_s3_probe.py
          docker compose exec -T media-delivery python - reader < scripts/r3_s3_probe.py
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail 100
