[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurselearn-api"
version = "0.2.0"
description = "API NurseLearn AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5.0,<7",
]

[project.optional-dependencies]
# httpx2 : client de test recommandé par Starlette (remplace httpx, déprécié pour TestClient).
dev = ["pytest>=8,<10", "httpx2>=2.2,<3", "ruff>=0.15,<1", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.mypy]
# Vérification de typage introduite progressivement (Phase 2.0) : code applicatif seulement.
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
# Désactivé : les stubs disponibles varient selon l'environnement (poste, CI).
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
