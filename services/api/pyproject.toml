[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurselearn-api"
version = "0.2.0"
description = "API NurseLearn AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "redis>=5.0,<7",
  # Hachage des mots de passe (Argon2id, recommandation OWASP).
  "argon2-cffi>=23.1,<26",
  # Médias protégés (2.2.3-b, D20) : bibliothèques maintenues, licences compatibles, auditées (pip-audit).
  # Pillow (HPND) : décodage et réencodage des images ; pypdf (BSD-3) : analyse structurelle des PDF ;
  # boto3 (Apache-2.0) : client S3 du stockage privé RustFS.
  "pillow>=13,<14",
  "pypdf>=6.21.4,<7",
  "boto3>=1.35,<2",
  # Plancher de sécurité d'une dépendance transitive de FastAPI (CVE-2026-114603, CVE-2026-126360).
  "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
# httpx2 : client de test recommandé par Starlette (remplace httpx, déprécié pour TestClient).
dev = ["pytest>=8,<10", "httpx2>=2.2,<3", "ruff>=0.15,<1", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.mypy]
# Vérification de typage introduite progressivement (Phase 2.0) : code applicatif seulement.
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
# Désactivé : les stubs disponibles varient selon l'environnement (poste, CI).
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
